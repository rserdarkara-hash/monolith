name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # TWO OPERATING SYSTEMS, NOT TWO R VERSIONS. An R matrix would buy nothing
    # here: renv.lock pins R 4.5.2 and global.R refuses to start below 4.5.0, so
    # an oldrel leg fails by design, and an R-devel leg needs an UNPINNED library
    # - which is a different question, asked by upstream.yaml.
    #
    # The platform, by contrast, has already moved a recorded number. The
    # ok_surface_digest baseline passed on Windows and failed on Linux because
    # robust_vgm_fit()'s candidate search landed on a near-tie that a different
    # BLAS/libm resolves the other way; the fix was to pin the variogram and the
    # boundary, and the way to notice the next one before a release is to run
    # both platforms. Development happens on Windows, so Linux is the leg that
    # was never exercised locally - and vice versa.
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the other: when a number is
      # platform-dependent, the interesting output is BOTH legs' results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # The Windows leg is reported but not yet blocking. Its risk is a toolchain
    # one, not a scientific one: P3M serves binaries for CURRENT versions, so a
    # pinned version that CRAN has since superseded falls back to a source build,
    # and on Windows a source build of sf/terra is slow and fragile. A red badge
    # from that would destroy the signal this job exists to give. Promote it by
    # deleting this line once a few runs have restored cleanly.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    env:
      # Serves pre-built binaries to both runners where available; renv falls
      # back to source builds (CRAN archive) for pinned versions no longer
      # current. That fallback is the Windows leg's slow path, and the reason
      # it is reported rather than blocking.
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/latest
      DOWNLOAD_STATIC_LIBV8: 1
      # renv 1.2.4 orders installs only among packages it has to install, so a
      # package linked from a partially stale cache (gtable) does not hold back
      # its dependent (gridExtra) until its own dependency (rlang) is in. The
      # Linux-only post-install load test then fails on the missing rlang.
      # Windows never runs that test. The suite loads every package anyway.
      RENV_INSTALL_TEST_LOAD: false
    steps:
      - uses: actions/checkout@v5

      - name: Install system libraries for the spatial stack
        # Linux only: the Windows runner gets GDAL/PROJ/GEOS inside the sf and
        # terra binaries themselves, and has no apt.
        if: runner.os == 'Linux'
        run: |
          # Every library below comes from Ubuntu's own archives. The runner
          # image also configures third-party repos (Google Chrome, Microsoft)
          # that apt-get update insists on refreshing, and a hash mismatch
          # there - Google republishing its index mid-fetch - aborts the whole
          # step with exit 100 before anything is installed. Drop those two
          # sources: this removes the repositories, not the packages, so the
          # Chrome binary shinytest2 drives stays where it is.
          #
          # Match on content, not filename. Chrome ships a deb822
          # google-chrome.sources on noble, so deleting google-chrome.list
          # alone silently misses it. Ubuntu's own archives live in
          # /etc/apt/sources.list here and are untouched either way.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \
            \( -name '*.list' -o -name '*.sources' \) \
            -exec grep -lE 'dl\.google\.com|packages\.microsoft\.com' {} + \
            | sudo xargs -r rm -f
          # A surviving third-party repo must not fail the build: apt still
          # writes the Ubuntu lists ("old ones used instead") and the install
          # below fails loudly on its own if they are genuinely unusable.
          sudo apt-get update -o Acquire::Retries=3 || true
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libtiff5-dev libjpeg-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true

      - name: Restore pinned packages from renv.lock
        uses: r-lib/actions/setup-renv@v2

      - name: Run testthat suite
        run: Rscript tests/testthat.R
